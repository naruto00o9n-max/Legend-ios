name: LaMaProbe
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGNING_ALLOWED: NO
targets:
  LaMaProbe:
    type: application
    platform: iOS
    sources:
      - ProbeApp.swift
      - ../../App/Engine/BigLaMaAssets.swift
      - ../../App/Engine/BigLaMaEngine.swift
      - ../../App/Engine/BackgroundWork.swift
      - path: ../../App/Resources/big-lama-model.json
        buildPhase: resources
      - path: ../../.work/lama-probe-fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookies.lama-probe
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - sdk: CoreML.framework
      - sdk: CoreVideo.framework
      - sdk: UIKit.framework
      - sdk: ImageIO.framework
  LaMaProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ProbeTests.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cookies.lama-probe.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: LaMaProbe
schemes:
  LaMaProbe:
    build:
      targets:
        LaMaProbe: all
        LaMaProbeTests: [test]
    test:
      targets: [LaMaProbeTests]
