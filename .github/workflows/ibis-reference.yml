name: Inspect signed ibisPaint Android reference
on:
  push:
    branches: [verify/ibis-reference-oct16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and verify the untouched reference bundle
        run: |
          mkdir -p .work/ibis/package build/ibis
          curl --fail --location --retry 2 'https://apk.captain-droid.com/wp-content/uploads/2026/10/jp.ne.ibis.ibispaintx.app_1401020064.xapk' -o .work/ibis/reference.xapk
          echo '7c52acb5d784eef2d4b9f39c4f83829a5d0ff99cc36d9e23626330be4f55ff12  .work/ibis/reference.xapk' | sha256sum -c -
          unzip -q .work/ibis/reference.xapk '*.apk' -d .work/ibis/package
      - name: Enable hardware virtualization for this disposable test device
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_c
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 600
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader -feature -Vulkan -camera-back none
          script: python3 scripts/inspect_ibis_reference.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ibis-reference-interaction
          path: build/ibis/
