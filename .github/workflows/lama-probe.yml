name: Big LaMa actual iOS inference probe
on:
  push:
    branches: [verify/lama-coreml-oct14]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lama-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-model:
    name: Actual downloaded Big LaMa on ${{ matrix.screen }}
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: python3 -m venv .work/lama-fixtures-env && .work/lama-fixtures-env/bin/pip -q install Pillow
      - run: .work/lama-fixtures-env/bin/python scripts/prepare_lama_probe.py
      - run: xcodegen generate --spec scripts/lama-probe/project.yml --project .work
      - name: Run Core ML inside actual iOS simulator app
        run: bash scripts/lama-probe/test.sh '${{ matrix.screen }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: big-lama-native-${{ matrix.screen }}
          path: |
            build/lama-probe-*.log
            build/lama-probe-attachments/
          retention-days: 30
