name: Cookies Editor iPad repair and unsigned IPA
on:
  push:
    branches: [main]
    paths: ['App/**', 'Tests/**', 'UITests/**', 'ServicesTests/**', 'ServicesUITests/**', 'project.yml', 'scripts/build_ipas.sh', 'scripts/test_simulators.sh', '.github/workflows/ios-build.yml']
  workflow_dispatch:
concurrency:
  group: cookies-ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  package:
    name: One unsigned arm64 IPA and PNG integrity
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: python3 scripts/fetch_resources.py
      - run: xcodegen generate
      - run: bash scripts/build_ipas.sh
      - name: Verify original dimensions and untouched source pixels
        run: |
          clang -O2 -DPNG_ARM_NEON_OPT=0 -I App/Core/Vendor/libpng Tests/pixel_roundtrip.c App/Core/PixelCore.c App/Core/Vendor/libpng/*.c -lz -o .work/pixel-test
          mkdir -p .work/pixel-fixture
          .work/pixel-test .work/pixel-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-unsigned-ipa
          path: build/
          retention-days: 30
  ui:
    name: Editor, Photos and account on ${{ matrix.screen }}
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: python3 scripts/fetch_resources.py
      - run: xcodegen generate
      - run: bash scripts/test_simulators.sh ${{ matrix.screen }}
      - run: python3 scripts/collect_evidence.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-evidence-${{ matrix.screen }}
          path: build/
          retention-days: 30
