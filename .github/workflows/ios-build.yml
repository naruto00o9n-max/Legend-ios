name: Cookies Editor iPad repair and unsigned IPA
on:
  push:
    branches: [main, verify/style-form-oct11]
    paths: ['App/**', 'Tests/**', 'UITests/**', 'ServicesTests/**', 'ServicesUITests/**', 'LocalUITests/**', 'project.yml', 'scripts/build_ipas.sh', 'scripts/verify_build_identity.py', 'scripts/test_simulators.sh', 'scripts/test_local_simulator.sh', 'scripts/fetch_whitening_fixtures.py', 'scripts/whitening-fixtures.json', 'scripts/verify_control_retry.py', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Full validation or an unchanged-app test regression retry
        type: choice
        options: [full, focused, regression, controls, styles, performance]
        default: full
concurrency:
  group: cookies-ios-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  supersede:
    name: Keep the newest branch build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          retries: 3
          script: |
            // Allow the newest supersede job to start even while an older run is
            // cancelling. Only the current branch head may schedule native jobs.
            const head = await github.rest.git.getRef({ ...context.repo, ref: context.ref.replace('refs/', '') });
            if (head.data.object.sha !== context.sha) {
              core.setFailed('This run was superseded before native jobs started.');
              return;
            }
            // Retire all older queued/running branch builds before native work.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ios-build.yml', branch: context.ref.replace('refs/heads/', ''), per_page: 100
            });
            for (const run of runs) {
              if (run.id >= context.runId || !['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)) continue;
              try { await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id}); }
              catch (error) { if (![409, 422].includes(error.status)) throw error; }
            }
  package:
    if: ${{ !contains(github.event.head_commit.message, '[render-control retry]') && !contains(github.event.head_commit.message, '[fixture initialization retry]') }}
    needs: supersede
    name: Two unsigned arm64 IPAs and PNG integrity
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/build_ipas.sh
      - name: Verify original dimensions and untouched source pixels
        run: |
          clang -O2 -DPNG_ARM_NEON_OPT=0 -I App/Core/Vendor/libpng Tests/pixel_roundtrip.c App/Core/PixelCore.c App/Core/Vendor/libpng/*.c -lz -o .work/pixel-test
          mkdir -p .work/pixel-fixture
          .work/pixel-test .work/pixel-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-unsigned-ipa
          path: build/
          retention-days: 30
  ui:
    needs: supersede
    name: Editor, Photos and account on ${{ matrix.screen }}
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - name: Native engine and real whitening regressions
        timeout-minutes: 35
        if: ${{ !contains(github.event.head_commit.message, '[ui-only retry]') && (github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'focused') }}
        env:
          COOKIES_CORE_FILTER: ${{ contains(github.event.head_commit.message, '[fixture initialization retry]') && 'CookiesTests/RenderStabilityTests/testPersistentToolPreviewHonorsHiddenReorderedAndDrawingForeground' || '' }}
        run: |
          if [[ -n "$COOKIES_CORE_FILTER" ]]; then
            # The shipped app and all other engine cases are byte-identical to
            # the completed candidate; rerun only the corrected fixture setup.
            git diff --exit-code dc3b42229f773a29ab0ea437d21581141fd10a1b HEAD -- App ServicesTests ServicesUITests UITests LocalUITests project.yml scripts/build_ipas.sh scripts/fetch_resources.py scripts/vendor-hashes.json
          fi
          bash scripts/test_simulators.sh ${{ matrix.screen }} core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-engine-${{ matrix.screen }}
          path: |
            build/test-*-core.log
            build/whitening-*/
          retention-days: 30
      - name: Interfaces, Photos and services
        timeout-minutes: 35
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[fixture initialization retry]') }}
        env:
          RENDER_CONTROL_RETRY: ${{ contains(github.event.head_commit.message, '[render-control retry]') }}
          TASK_SCOPE: ${{ contains(github.event.head_commit.message, '[image effects validation]') && 'image-effects' || contains(github.event.head_commit.message, '[performance validation]') && 'performance' || contains(github.event.head_commit.message, '[style form retry]') && 'styles' || contains(github.event.head_commit.message, '[control hit-area retry]') && 'controls' || contains(github.event.head_commit.message, '[ui-only retry]') && 'focused' || contains(github.event.head_commit.message, '[interface test retry]') && 'regression' || inputs.verification_scope }}
        run: |
          if [[ "$TASK_SCOPE" == image-effects ]]; then
            # Full native engine gates remain mandatory for this product change.
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testImageEffectsStackControlsResetAndReopen,CookiesUITests/EditorUITests/testCompoundGradientStyleAndPerspectiveControlsStayUsable,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary'
          elif [[ "$TASK_SCOPE" == performance ]]; then
            # Product changes: run every engine test plus actual gradient teardown,
            # style controls, persistence, Files and original-resolution Photos.
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testCompoundGradientStyleAndPerspectiveControlsStayUsable,CookiesUITests/EditorUITests/testCreateUserStyleAndApplyGlyphGradient,CookiesUITests/EditorUITests/testColorLibraryFavoritesAndNegativeLineSpacing,CookiesUITests/EditorUITests/testManualDoneRemembersOutlineForNewManualText,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation,CookiesUITests/EditorUITests/testStrokePlusMinusChangesByExactlyOneWithoutDragging,CookiesUITests/EditorUITests/testOrganizedSettingsAndDetailedGuide'
          elif [[ "$TASK_SCOPE" == styles ]]; then
            python3 scripts/verify_style_form_retry.py
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testColorLibraryFavoritesAndNegativeLineSpacing,CookiesUITests/EditorUITests/testCreateUserStyleAndApplyGlyphGradient,CookiesUITests/EditorUITests/testOrganizedSettingsAndDetailedGuide,CookiesUITests/EditorUITests/testFullTagEditorSavesAndReopensItsRealTextTools,CookiesUITests/EditorUITests/testManualDoneRemembersOutlineForNewManualText,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation'
          elif [[ "$TASK_SCOPE" == controls ]]; then
            # Only the two mechanically verified, nonvisual color-control
            # corrections may reuse the unaffected full-suite UI results.
            python3 scripts/verify_control_retry.py
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testColorLibraryFavoritesAndNegativeLineSpacing,CookiesUITests/EditorUITests/testCreateUserStyleAndApplyGlyphGradient,CookiesUITests/EditorUITests/testOrganizedSettingsAndDetailedGuide,CookiesUITests/EditorUITests/testFullTagEditorSavesAndReopensItsRealTextTools,CookiesUITests/EditorUITests/testManualDoneRemembersOutlineForNewManualText,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation'
          elif [[ "$TASK_SCOPE" == focused || "$TASK_SCOPE" == regression ]]; then
            # Reuse already-passed interfaces only with identical product/build
            # sources. Regression mode still runs the full native engine suite.
            git diff --exit-code HEAD^ HEAD -- App ServicesTests ServicesUITests project.yml scripts
            # Local edition UI always runs in full, including Photos integrity.
            if [[ "$TASK_SCOPE" == focused ]]; then
              git diff --exit-code HEAD^ HEAD -- Tests
              if [[ "$RENDER_CONTROL_RETRY" == true ]]; then
                git diff --exit-code 07cbbe3b4f99818f4f523ed8ad360ec7c21627a1 HEAD -- App Tests ServicesTests ServicesUITests project.yml scripts
                bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testGradientPresetDisableRestoreAndEffectCardsDoNotTerminateEditor'
              else
                bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testCreateUserStyleAndApplyGlyphGradient,CookiesUITests/EditorUITests/testColorLibraryFavoritesAndNegativeLineSpacing,CookiesUITests/EditorUITests/testOrganizedSettingsAndDetailedGuide,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation'
              fi
            else
              bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testTextTapSuggestionRequiresExplicitConfirmation,CookiesUITests/EditorUITests/testCanvasTapDoesNotCreateUnrequestedTextAndFontsStayInsideEditor,CookiesUITests/EditorUITests/testStrokePlusMinusChangesByExactlyOneWithoutDragging,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation,CookiesUITests/EditorUITests/testTyperFilterPersistsAndReopensAtLatestUnusedBubble,CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testOrganizedSettingsAndDetailedGuide'
            fi
          else
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-interfaces-${{ matrix.screen }}
          path: |
            build/test-*.log
            build/gates-*.json
            build/photos-integrity-*.json
          retention-days: 30
      - name: Local edition without account or community
        timeout-minutes: 25
        if: ${{ !cancelled() && !contains(github.event.head_commit.message, '[render-control retry]') && !contains(github.event.head_commit.message, '[fixture initialization retry]') }}
        run: bash scripts/test_local_simulator.sh ${{ matrix.screen }}
      - run: python3 scripts/collect_evidence.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-verification-${{ matrix.screen }}
          path: |
            build/test-*.log
            build/gates-*.json
            build/photos-integrity-*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-gallery-${{ matrix.screen }}
          path: |
            build/ScreenGallery/
            build/verification.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-evidence-${{ matrix.screen }}
          path: build/
          retention-days: 30
