name: Cookies Editor iPad repair and unsigned IPA
on:
  push:
    branches: [main]
    paths: ['App/**', 'Tests/**', 'UITests/**', 'ServicesTests/**', 'ServicesUITests/**', 'LocalUITests/**', 'project.yml', 'scripts/build_ipas.sh', 'scripts/verify_build_identity.py', 'scripts/test_simulators.sh', 'scripts/test_local_simulator.sh', 'scripts/fetch_whitening_fixtures.py', 'scripts/whitening-fixtures.json', '.github/workflows/ios-build.yml']
  workflow_dispatch:
    inputs:
      verification_scope:
        description: Full validation or focused UI regression retry
        type: choice
        options: [full, focused]
        default: full
concurrency:
  group: cookies-ios-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  supersede:
    name: Keep the newest branch build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Retire superseded builds from the former per-commit concurrency policy.
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              ...context.repo, workflow_id: 'ios-build.yml', branch: context.ref.replace('refs/heads/', ''), per_page: 100
            });
            for (const run of runs) {
              if (run.id >= context.runId || !['queued', 'in_progress', 'waiting', 'pending'].includes(run.status)) continue;
              try { await github.rest.actions.cancelWorkflowRun({...context.repo, run_id: run.id}); }
              catch (error) { if (![409, 422].includes(error.status)) throw error; }
            }
  package:
    needs: supersede
    name: Two unsigned arm64 IPAs and PNG integrity
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/build_ipas.sh
      - name: Verify original dimensions and untouched source pixels
        run: |
          clang -O2 -DPNG_ARM_NEON_OPT=0 -I App/Core/Vendor/libpng Tests/pixel_roundtrip.c App/Core/PixelCore.c App/Core/Vendor/libpng/*.c -lz -o .work/pixel-test
          mkdir -p .work/pixel-fixture
          .work/pixel-test .work/pixel-fixture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-unsigned-ipa
          path: build/
          retention-days: 30
  ui:
    needs: supersede
    name: Editor, Photos and account on ${{ matrix.screen }}
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - name: Native engine and real whitening regressions
        if: ${{ !contains(github.event.head_commit.message, '[ui-only retry]') && (github.event_name != 'workflow_dispatch' || inputs.verification_scope != 'focused') }}
        run: bash scripts/test_simulators.sh ${{ matrix.screen }} core
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-engine-${{ matrix.screen }}
          path: |
            build/test-*-core.log
            build/whitening-*/
          retention-days: 30
      - name: Interfaces, Photos and services
        env:
          TASK_SCOPE: ${{ contains(github.event.head_commit.message, '[ui-only retry]') && 'focused' || inputs.verification_scope }}
        run: |
          if [[ "$TASK_SCOPE" == focused ]]; then
            # A test-only retry must never skip engine checks for changed app code.
            git diff --exit-code HEAD^ HEAD -- App Tests ServicesTests ServicesUITests LocalUITests project.yml scripts/fetch_resources.py scripts/fetch_whitening_fixtures.py scripts/whitening-fixtures.json
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testTextTapSuggestionRequiresExplicitConfirmation,CookiesUITests/EditorUITests/testStrokePlusMinusChangesByExactlyOneWithoutDragging,CookiesUITests/EditorUITests/testPhotosImportAndIPadOrientation'
          else
            bash scripts/test_simulators.sh '${{ matrix.screen }}' ui
          fi
      - name: Local edition without account or community
        if: always()
        run: bash scripts/test_local_simulator.sh ${{ matrix.screen }}
      - run: python3 scripts/collect_evidence.py
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-verification-${{ matrix.screen }}
          path: |
            build/test-*.log
            build/gates-*.json
            build/photos-integrity-*.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cookies-editor-evidence-${{ matrix.screen }}
          path: build/
          retention-days: 30
