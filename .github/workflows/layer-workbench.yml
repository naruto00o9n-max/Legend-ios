name: Layer workbench and non-destructive eraser
on:
  push:
    branches: [verify/layer-workbench-oct16]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supersede:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const head = await github.rest.git.getRef({...context.repo, ref:context.ref.replace('refs/', '')});
            if(head.data.object.sha !== context.sha){core.setFailed('Superseded head');return;}
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns,{...context.repo,workflow_id:'layer-workbench.yml',branch:context.ref.replace('refs/heads/',''),per_page:100});
            for(const run of runs){
              if(run.id >= context.runId || !['queued','in_progress','waiting','pending'].includes(run.status))continue;
              try{await github.rest.actions.cancelWorkflowRun({...context.repo,run_id:run.id});}
              catch(error){if(![409,422].includes(error.status))throw error;}
            }
  editor:
    needs: supersede
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - name: Native layer compositing, eraser opacity, import, export and regressions
        run: bash scripts/test_simulators.sh '${{ matrix.screen }}' core
      - name: Real layer controls and live eraser gestures, Photos and service regressions
        run: bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testLayerButtonsActuallyHideUnlockAndDelete,CookiesUITests/EditorUITests/testLayerTypeChipsMatchTheVisibleRows,CookiesUITests/EditorUITests/testEraserKeepsSelectedTextEditableWithoutCreatingDrawingLayers,CookiesUITests/EditorUITests/testPinchAndDrawing'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-workbench-${{ matrix.screen }}
          path: |
            build/test-*.log
            build/gates-*.json
            build/photos-integrity-*.json
            build/screenshots/
            build/whitening-*/
  local:
    needs: supersede
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/test_local_simulator.sh '${{ matrix.screen }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-workbench-local-${{ matrix.screen }}
          path: |
            build/test-*-local*.log
            build/gates-*-local.json
            build/photos-integrity-*-local.json
            build/screenshots/*-local/
  package:
    needs: supersede
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/build_ipas.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: layer-workbench-unsigned-ipas
          path: build/
