name: Whitening preferences and multiple font import
on:
  push:
    branches: [verify/whitening-preferences-oct14]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editor:
    strategy:
      fail-fast: false
      matrix:
        screen: [ipad, iphone]
    runs-on: macos-15-intel
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - name: Prove final wording-only follow-up
        if: ${{ contains(github.event.head_commit.message, '[wording followup]') }}
        run: |
          git fetch --no-tags origin 352ef452b459000305852db05b924cef1d01eb2c
          git diff --exit-code 352ef452b459000305852db05b924cef1d01eb2c HEAD -- App ':!App/UI/SniperWhiteningPanel.swift' Tests ServicesTests ServicesUITests LocalUITests project.yml scripts
      - name: Native preferences, font registration, backup and editor regressions
        if: ${{ !contains(github.event.head_commit.message, '[wording followup]') }}
        run: bash scripts/test_simulators.sh '${{ matrix.screen }}' core
      - name: Actual multiple Files selection, independent whitening choices, Photos and account
        run: bash scripts/test_simulators.sh '${{ matrix.screen }}' ui 'CookiesUITests/EditorUITests/testRealFilesPickerImportsFontAndReturnsToLibrary,CookiesUITests/EditorUITests/testManualSniperKeepsIndependentWhiteningMethodPerBubble'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitening-preferences-${{ matrix.screen }}
          path: |
            build/test-*.log
            build/gates-*.json
            build/photos-integrity-*.json
            build/screenshots/
            build/whitening-*/
  local:
    if: ${{ !contains(github.event.head_commit.message, '[wording followup]') || contains(github.event.head_commit.message, '[local verification]') }}
    strategy:
      fail-fast: false
      matrix:
        screen: ${{ fromJSON(contains(github.event.head_commit.message, '[local verification]') && '["iphone"]' || '["ipad","iphone"]') }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/test_local_simulator.sh '${{ matrix.screen }}'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitening-preferences-local-${{ matrix.screen }}
          path: |
            build/test-*-local*.log
            build/gates-*-local.json
            build/photos-integrity-*-local.json
            build/screenshots/*-local/
  package:
    if: ${{ !contains(github.event.head_commit.message, '[verification only]') }}
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - uses: actions/cache@v4
        with:
          path: |
            .work/reference.apk
            .work/opencv-ios.zip
            App/Core/Vendor
            App/Resources/cookies-logo.png
          key: cookies-native-v45-opencv411-${{ hashFiles('scripts/vendor-hashes.json') }}
      - run: python3 scripts/fetch_resources.py
      - run: python3 scripts/fetch_whitening_fixtures.py
      - run: xcodegen generate
      - run: bash scripts/build_ipas.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: whitening-preferences-unsigned-ipas
          path: build/
